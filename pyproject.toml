[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "governed-qa-forge"
version = "0.1.0"
description = "A governed dataset compiler for traceable synthetic question/answer corpora."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Governed QA Forge contributors" }]
keywords = ["synthetic-data", "fine-tuning", "dataset", "provenance", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "regex>=2025.7,<2027",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
qaforge = "qaforge.cli:app"

[project.urls]
Homepage = "https://github.com/robit-man/governed-qa-forge"
Repository = "https://github.com/robit-man/governed-qa-forge"
Issues = "https://github.com/robit-man/governed-qa-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qaforge"]

[tool.hatch.build.targets.wheel.shared-data]
"deploy/systemd" = "share/qaforge/systemd"

[tool.hatch.build.targets.sdist]
only-include = [
  "/src",
  "/tests",
  "/docs",
  "/deploy",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["/.aiwg", "/.github", "/.agents", "/.codex", "/.env*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qaforge"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qaforge"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "regex"
ignore_missing_imports = true
